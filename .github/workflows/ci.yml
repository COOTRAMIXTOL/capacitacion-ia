name: CI

# Se ejecuta en cada pull request y en cada push a las ramas principales
on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

# Mínimo privilegio: el flujo solo necesita leer el código
permissions:
  contents: read

# Si llega un nuevo push a la misma rama o PR, se cancela la ejecución anterior
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Compilar y probar
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v5

      - name: Instalar .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restaurar dependencias
        run: dotnet restore

      # Puerta de calidad 1: el código debe respetar el formato del proyecto
      - name: Verificar formato del código
        run: dotnet format --verify-no-changes --no-restore

      # Puerta de calidad 2: cualquier advertencia del compilador se trata como error
      - name: Compilar (advertencias como errores)
        run: dotnet build --no-restore --configuration Release -warnaserror

      # Puerta de calidad 3: las 13 pruebas deben pasar, y se mide la cobertura
      - name: Ejecutar pruebas unitarias con cobertura
        run: >
          dotnet test --no-build --configuration Release
          --logger "trx;LogFileName=resultados.trx"
          --results-directory ./resultados-pruebas
          --collect:"XPlat Code Coverage"

      - name: Resumen de cobertura
        if: always()
        uses: danielpalme/ReportGenerator-GitHub-Action@5
        with:
          reports: './resultados-pruebas/**/coverage.cobertura.xml'
          targetdir: './reporte-cobertura'
          reporttypes: 'MarkdownSummaryGithub;HtmlInline'

      - name: Publicar resumen en la ejecución
        if: always()
        run: |
          if [ -f ./reporte-cobertura/SummaryGithub.md ]; then
            cat ./reporte-cobertura/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
          fi

      # Puerta de calidad 4: ningún paquete NuGet con vulnerabilidades conocidas
      - name: Revisar paquetes vulnerables
        run: |
          dotnet list package --vulnerable --include-transitive | tee vulnerables.txt
          if grep -q "has the following vulnerable packages" vulnerables.txt; then
            echo "::error::Se encontraron paquetes con vulnerabilidades conocidas."
            exit 1
          fi

      - name: Guardar resultados de pruebas y cobertura
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: resultados-pruebas
          path: |
            ./resultados-pruebas
            ./reporte-cobertura
